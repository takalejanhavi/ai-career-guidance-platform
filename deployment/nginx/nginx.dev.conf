# ──────────────────────────────────────────────────────────────────
# nginx.dev.conf — Development NGINX Configuration
# Used by: docker-compose.yml (mounted as /etc/nginx/nginx.conf)
#
# Differences from production nginx.conf:
#   - No SSL / TLS termination
#   - No HSTS or Strict-Transport-Security headers
#   - Relaxed rate limits (high burst for hot-reload workflows)
#   - Verbose access logging for debugging
#   - Serves on port 80 only
#   - No certbot / ACME challenge locations
# ──────────────────────────────────────────────────────────────────

user  nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── WebSocket upgrade map ─────────────────────────────────────
    # Referenced as $connection_upgrade in the frontend proxy block.
    # Converts the Upgrade header value to the correct Connection
    # header so Vite HMR WebSocket connections pass through cleanly.
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ""        close;
    }

    # ── Logging ───────────────────────────────────────────────────
    log_format dev
        '$remote_addr [$time_local] "$request" '
        '$status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time';

    access_log /var/log/nginx/access.log dev;

    # ── Performance ───────────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ── Body size (generous for dev file uploads) ─────────────────
    client_max_body_size 50m;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # ── Rate limiting (relaxed for development) ───────────────────
    # High limits prevent dev tools / hot-reload from being blocked
    limit_req_zone $binary_remote_addr zone=api_dev:10m  rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth_dev:10m rate=60r/m;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────
    # Service names match those defined in docker-compose.yml

    upstream backend {
        server backend:4000;
        keepalive 16;
    }

    upstream frontend {
        server frontend:5173;
        keepalive 8;
    }

    upstream ai_service {
        server ai_service:5050;
        keepalive 4;
    }

    # ─────────────────────────────────────────────────────────────
    # Main dev server — port 80
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost _;

        # ── Health check (no logging) ─────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","env":"development"}';
            add_header Content-Type application/json;
        }

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Backend API proxy ─────────────────────────────────────
        location /api/ {
            limit_req zone=api_dev burst=100 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Long timeouts to accommodate debugger breakpoints
            proxy_connect_timeout  10s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;

            # Auth endpoints — slightly stricter even in dev
            # to surface rate-limit behaviour during testing
            location /api/v1/auth/ {
                limit_req zone=auth_dev burst=20 nodelay;
                proxy_pass         http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host            $host;
                proxy_set_header X-Real-IP       $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Connection      "";
            }
        }

        # ── AI service proxy (direct access in dev) ───────────────
        location /ai/ {
            limit_req zone=api_dev burst=30 nodelay;

            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass         http://ai_service;
            proxy_http_version 1.1;

            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";

            proxy_read_timeout 120s;
        }

        # ── Vite HMR WebSocket ────────────────────────────────────
        # Vite uses a WebSocket on the same origin for hot-module
        # replacement. Without this block the upgrade is dropped and
        # the browser console shows "HMR disconnected" errors.
        location ~ ^/@(vite|react-refresh|hmr) {
            proxy_pass          http://frontend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_set_header    Host       $host;
            proxy_cache_bypass  $http_upgrade;
            proxy_read_timeout  86400s;
        }

        # ── Frontend proxy — Vite dev server ──────────────────────
        # Vite handles its own SPA routing; forward everything
        # that is not /api/ or /ai/ to the Vite dev server.
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Pass upgrade headers so WS connections on / also work
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 60s;
        }

        # ── Error pages ───────────────────────────────────────────
        error_page 502 503 504 @gateway_error;
        location @gateway_error {
            default_type application/json;
            return 503 '{"error":"upstream unavailable","hint":"is docker-compose up running?"}';
        }
    }
}
