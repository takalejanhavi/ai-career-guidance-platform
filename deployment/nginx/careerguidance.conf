# ──────────────────────────────────────────────────────────────────
# careerguidance.conf — Platform Virtual Host
# Handles: HTTPS termination, SPA routing, API proxying
# ──────────────────────────────────────────────────────────────────

# ── SSL session cache (shared across workers) ─────────────────────
ssl_session_cache   shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ── Modern TLS configuration ──────────────────────────────────────
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;

# ── OCSP Stapling ─────────────────────────────────────────────────
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ─────────────────────────────────────────────────────────────────
# HTTPS main server
# ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careerguidance.app www.careerguidance.app;

    # ── SSL certificates (Let's Encrypt via certbot) ──────────────
    ssl_certificate     /etc/letsencrypt/live/careerguidance.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerguidance.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/careerguidance.app/chain.pem;

    # ── HSTS (6 months, include subdomains, preload) ───────────────
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # ── Content Security Policy ───────────────────────────────────
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'unsafe-inline' 'unsafe-eval'; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "font-src 'self' https://fonts.gstatic.com data:; "
        "img-src 'self' data: https:; "
        "connect-src 'self' https://api.careerguidance.app wss://api.careerguidance.app; "
        "frame-ancestors 'none';"
    always;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/careerguidance.access.log json_combined;
    error_log  /var/log/nginx/careerguidance.error.log warn;

    # ── Health check (no rate limit, no logging) ──────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # ── API proxy → Node.js backend ───────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_log_level warn;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        proxy_buffering          on;
        proxy_buffer_size        8k;
        proxy_buffers            8 32k;
        proxy_busy_buffers_size  64k;

        # Auth endpoints — stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";
        }
    }

    # ── AI service proxy (internal only — exposed via backend normally) ─
    location /ai/ {
        # Restrict to internal network only
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        limit_req zone=ai_limit burst=10 nodelay;

        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection      "";
        proxy_read_timeout 120s;
    }

    # ── Static assets — aggressive caching ───────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    # ── React SPA — HTML5 History API fallback ────────────────────
    location / {
        # No-cache for HTML (ensures fresh app shell)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;

        try_files $uri $uri/ /index.html;
    }

    # ── Block common attack vectors ───────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block PHP and other scripting attempts
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        return 404;
    }
}

# ─────────────────────────────────────────────────────────────────
# API subdomain (api.careerguidance.app) — backend only
# ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.careerguidance.app;

    ssl_certificate     /etc/letsencrypt/live/careerguidance.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerguidance.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # CORS headers for API subdomain
    add_header Access-Control-Allow-Origin "https://careerguidance.app" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
    add_header Access-Control-Allow-Credentials "true" always;

    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        proxy_pass http://backend/healthz;
    }
}

# ─────────────────────────────────────────────────────────────────
# Frontend-only config (used in Dockerfile.frontend)
# ─────────────────────────────────────────────────────────────────
# This is referenced as frontend.conf from the container
