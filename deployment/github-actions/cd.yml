# ──────────────────────────────────────────────────────────────────
# .github/workflows/cd.yml — Continuous Deployment
#
# Triggers:
#   - Push to 'develop' → deploy to staging
#   - Push to 'main'    → deploy to production (with approval gate)
#   - Manual trigger    → deploy to specified environment
# ──────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      force:
        description: 'Force deploy even if tests fail'
        type: boolean
        default: false

env:
  REGISTRY:      ghcr.io
  IMAGE_PREFIX:  ${{ github.repository_owner }}/career-guidance
  NODE_VERSION:  '20'

jobs:

  # ════════════════════════════════════════════════════════════════
  # Determine environment
  # ════════════════════════════════════════════════════════════════
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag:   ${{ steps.tag.outputs.tag }}
      sha_short:   ${{ steps.tag.outputs.sha_short }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Generate image tag
        id: tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${SHA_SHORT}" >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════════════════
  # Build and push Docker images
  # ════════════════════════════════════════════════════════════════
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: setup

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend, ai-service]
        include:
          - service: backend
            context:    ./backend
            dockerfile: ./deployment/dockerfiles/Dockerfile.backend
          - service: frontend
            context:    ./frontend
            dockerfile: ./deployment/dockerfiles/Dockerfile.frontend
          - service: ai-service
            context:    ./ai-service
            dockerfile: ./deployment/dockerfiles/Dockerfile.ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          target:     production
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_API_URL=${{ needs.setup.outputs.environment == 'production' && 'https://api.careerguidance.app' || 'https://api.staging.careerguidance.app' }}
            VITE_APP_ENV=${{ needs.setup.outputs.environment }}
            VITE_APP_VERSION=${{ needs.setup.outputs.sha_short }}

      - name: Image digest
        run: echo "Pushed ${{ matrix.service }} → ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"

  # ════════════════════════════════════════════════════════════════
  # Deploy to Staging
  # ════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, build-images]
    if: needs.setup.outputs.environment == 'staging' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.careerguidance.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deploy to Render (staging) ─────────────────────────────
      - name: Trigger Render staging deploy — backend
        run: |
          curl -s -X POST "${{ secrets.RENDER_STAGING_BACKEND_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" || echo "Render hook failed (non-critical)"

      - name: Trigger Render staging deploy — frontend
        run: |
          curl -s -X POST "${{ secrets.RENDER_STAGING_FRONTEND_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" || echo "Render hook failed (non-critical)"

      - name: Trigger Render staging deploy — AI service
        run: |
          curl -s -X POST "${{ secrets.RENDER_STAGING_AI_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" || echo "Render hook failed (non-critical)"

      # ── Wait for services to be healthy ────────────────────────
      - name: Wait for staging services
        run: |
          echo "Waiting for staging to come up..."
          sleep 60

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.staging.careerguidance.app/healthz 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Staging backend healthy"
              break
            fi
            sleep 15
          done

      # ── Smoke tests ────────────────────────────────────────────
      - name: Smoke test — staging health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.staging.careerguidance.app/healthz)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging healthcheck failed: HTTP $STATUS"
            exit 1
          fi
          echo "✓ Staging API healthy (HTTP $STATUS)"

      - name: Smoke test — staging frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://staging.careerguidance.app)
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Staging frontend returned HTTP $STATUS"
          fi
          echo "Frontend status: HTTP $STATUS"

      - name: Staging deploy summary
        run: |
          echo "## 🚀 Staging Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: \`${{ needs.setup.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging.careerguidance.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════
  # Production approval gate
  # ════════════════════════════════════════════════════════════════
  production-gate:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [setup, build-images]
    if: needs.setup.outputs.environment == 'production' || github.ref == 'refs/heads/main'
    environment:
      name: production-gate   # requires manual approval in GitHub Environments
    steps:
      - run: echo "Production deployment approved by ${{ github.actor }}"

  # ════════════════════════════════════════════════════════════════
  # Deploy to Production
  # ════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build-images, production-gate]
    environment:
      name: production
      url: https://careerguidance.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deploy to Render (production) ──────────────────────────
      - name: Trigger Render production deploy — backend
        run: |
          curl -sf -X POST "${{ secrets.RENDER_PROD_BACKEND_DEPLOY_HOOK }}"
          echo "✓ Backend deploy triggered"

      - name: Trigger Render production deploy — frontend
        run: |
          curl -sf -X POST "${{ secrets.RENDER_PROD_FRONTEND_DEPLOY_HOOK }}"
          echo "✓ Frontend deploy triggered"

      - name: Trigger Render production deploy — AI service
        run: |
          curl -sf -X POST "${{ secrets.RENDER_PROD_AI_DEPLOY_HOOK }}"
          echo "✓ AI service deploy triggered"

      # ── Wait and verify ────────────────────────────────────────
      - name: Wait for production rollout
        run: |
          echo "Waiting for production rollout (90s)..."
          sleep 90

      - name: Health check — production API
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.careerguidance.app/healthz 2>/dev/null || echo "000")
            echo "Attempt $i/15: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Production API healthy"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "::error::Production health check failed after 15 attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Health check — production frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://careerguidance.app)
          echo "Frontend: HTTP $STATUS"

      # ── Post-deploy notifications ──────────────────────────────
      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ *Production Deploy Succeeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *MentorChain Production Deploy* — `${{ needs.setup.outputs.sha_short }}`\n*Deployed by:* ${{ github.actor }}\n*URL:* https://mentorchain.app"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 *Production Deploy FAILED* — `${{ needs.setup.outputs.sha_short }}`\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create GitHub Release (production only)
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.setup.outputs.sha_short }}
          name: Release ${{ needs.setup.outputs.sha_short }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Production deploy summary
        run: |
          echo "## 🎉 Production Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: \`${{ needs.setup.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://careerguidance.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
