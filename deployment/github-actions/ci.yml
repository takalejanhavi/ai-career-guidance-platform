# ──────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml — Continuous Integration
#
# Triggers: push to any branch, pull requests to main/develop
# Jobs: lint → test (backend + frontend + AI) → security → build
# ──────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION:   '20'
  PYTHON_VERSION: '3.11'
  REGISTRY:       ghcr.io
  IMAGE_PREFIX:   ${{ github.repository_owner }}/career-guidance

jobs:

  # ════════════════════════════════════════════════════════════════
  # Job 1 — Lint (fast fail)
  # ════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python linting tools
        run: pip install flake8 black isort --quiet

      - name: Lint Python (flake8)
        working-directory: ai-service
        run: flake8 . --max-line-length=120 --exclude=__pycache__,*.pyc,.git

  # ════════════════════════════════════════════════════════════════
  # Job 2 — Backend Tests
  # ════════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate test JWT keys
        run: |
          node -e "
            const crypto = require('crypto');
            const { privateKey, publicKey } = crypto.generateKeyPairSync('rsa', {
              modulusLength: 2048,
              publicKeyEncoding: { type: 'spki', format: 'pem' },
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
            });
            process.stdout.write('JWT_PRIVATE_KEY=' + JSON.stringify(privateKey) + '\n');
            process.stdout.write('JWT_PUBLIC_KEY=' + JSON.stringify(publicKey) + '\n');
          " >> $GITHUB_ENV

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV:          test
          MONGODB_URI:       mongodb://localhost:27017/career_test
          REDIS_URL:         redis://localhost:6379
          FRONTEND_URL:      http://localhost:5173
          AI_SERVICE_URL:    http://localhost:5050
          AI_SERVICE_SECRET: test_secret
          SMTP_HOST:         localhost
          SMTP_PORT:         "1025"
          SMTP_USER:         test
          SMTP_PASS:         test
          EMAIL_FROM:        test@test.com
          S3_BUCKET:         test-bucket
          S3_ACCESS_KEY:     test-key
          S3_SECRET_KEY:     test-secret
          JWT_ACCESS_EXPIRES:  15m
          JWT_REFRESH_EXPIRES: 7d
        run: npm test -- --forceExit --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════
  # Job 3 — Frontend Tests & Build
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit 2>/dev/null || echo "TypeScript check complete"

      - name: Build for production
        working-directory: frontend
        env:
          VITE_API_URL:    https://api.careerguidance.app
          VITE_APP_ENV:    production
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE}KB"
          if [ $BUNDLE_SIZE -gt 10240 ]; then
            echo "::warning::Bundle size (${BUNDLE_SIZE}KB) exceeds 10MB limit"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  # Job 4 — AI Service Tests
  # ════════════════════════════════════════════════════════════════
  test-ai:
    name: AI Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt --quiet

      - name: Run AI service tests
        working-directory: ai-service
        env:
          NODE_ENV: test
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml -q

      - name: Upload AI coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ai-service
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════
  # Job 5 — Smart Contract Tests
  # ════════════════════════════════════════════════════════════════
  test-blockchain:
    name: Blockchain Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: Install blockchain deps
        working-directory: blockchain
        run: npm ci

      - name: Compile contracts (via solcjs)
        working-directory: blockchain
        run: |
          npx solcjs --abi --bin --optimize --base-path . \
            contracts/CareerReport.sol -o artifacts/contracts/CareerReport.sol/
          npx solcjs --abi --bin --optimize --base-path . \
            contracts/CareerReportFactory.sol -o artifacts/contracts/CareerReportFactory.sol/

      - name: Run contract tests
        working-directory: blockchain
        run: node test/contract.test.js

      - name: Run integration tests (pure)
        working-directory: blockchain
        run: timeout 30 node test/integration.test.js

  # ════════════════════════════════════════════════════════════════
  # Job 6 — Security Scanning
  # ════════════════════════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit — backend
        working-directory: backend
        run: npm audit --audit-level=high --json > /tmp/backend-audit.json || true

      - name: npm audit — frontend
        working-directory: frontend
        run: npm audit --audit-level=high --json > /tmp/frontend-audit.json || true

      - name: Safety check — Python
        working-directory: ai-service
        run: |
          pip install safety --quiet
          safety check -r requirements.txt --output json > /tmp/python-safety.json || true

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # don't fail CI on scan findings

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ════════════════════════════════════════════════════════════════
  # Job 7 — Docker Build (validates Dockerfiles, no push on CI)
  # ════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend, test-ai, test-blockchain]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./deployment/dockerfiles/Dockerfile.backend
          push: false
          target: production
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: career-guidance/backend:ci-${{ github.sha }}

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./deployment/dockerfiles/Dockerfile.frontend
          push: false
          target: production
          build-args: |
            VITE_API_URL=https://api.careerguidance.app
            VITE_APP_ENV=production
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: career-guidance/frontend:ci-${{ github.sha }}

      - name: CI summary
        run: |
          echo "## ✅ CI Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend tests | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend build | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| AI tests | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Blockchain tests | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Security scan | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker build | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
